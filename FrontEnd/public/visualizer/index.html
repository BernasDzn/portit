<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Cube - DEI</title>
    <style>
        body {
            margin: 0;
        }

        #title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            text-align: center;
            border-radius: 8px;
            border-width: 0.5px;
            border-style: solid;
            border-color: #ffffff1a;

            background: #56628a28;

            width: fit-content;
            padding: 10px 20px;

            font-family: 'Inter';
            font-size: 2.5vmin;
            color: #ffffff;

            box-shadow: 0 0 10px #00000088;
            backdrop-filter: blur(30px);
        }

        #help {
            position: absolute;
            bottom: 2vh;
            right: 1vw;

            border-radius: 8px;
            border-width: 0.5px;
            border-style: solid;
            border-color: #ffffff1a;

            background: #56628a28;

            font-family: 'Inter';
            font-size: 1.3vmin;
            color: #ffffff;

            z-index: 5;
            box-shadow: 0 0 10px #00000088;
            backdrop-filter: blur(30px);
        }

        #vessel-status-legend {
            position: absolute;
            bottom: 20px;
            left: 120px;

            border-radius: 8px;
            border-width: 0.5px;
            border-style: solid;
            border-color: #ffffff1a;

            background: #56628a28;

            font-family: 'Inter';
            font-size: 1.3vmin;
            color: #ffffff;

            z-index: 5;
            box-shadow: 0 0 10px #00000088;
            backdrop-filter: blur(30px);
            padding: 10px 15px;
            min-width: 18vmin;
            width: 18vmin;
            transition: max-height 0.3s ease;
        }

        .legend-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .legend-title {
            font-size: 1.5vmin;
            font-weight: 600;
            opacity: 0.9;
        }

        .legend-toggle {
            font-size: 1.4vmin;
            opacity: 0.7;
            transition: transform 0.3s ease;
            margin-left: 8px;
        }

        #vessel-status-legend.collapsed .legend-toggle {
            transform: rotate(-90deg);
        }

        .legend-content {
            overflow: hidden;
            max-height: 500px;
            transition: max-height 0.3s ease, margin-top 0.3s ease;
            margin-top: 8px;
        }

        #vessel-status-legend.collapsed .legend-content {
            max-height: 0;
            margin-top: 0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 6px 0;
            gap: 8px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            display: inline-block;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
        }

        .legend-label {
            font-size: 1.3vmin;
            opacity: 0.95;
        }

        table {
            table-layout: fixed;
            margin: auto;
        }

        table {
            width: 24vmin;
        }

        th,
        td {
            overflow: hidden;
            padding: 4px;
        }

        canvas {
            display: block;
        }

        #clock {
            position: absolute;
            top: 30px;
            left: 120px;
            padding: 10px 16px;
            border-radius: 8px;
            border-width: 0.5px;
            border-style: solid;
            border-color: #ffffff1a;
            min-width: 18vmin;

            background: #56628a28;

            font-family: 'Inter';
            font-size: 1.8vmin;
            color: #ffffff;

            z-index: 5;
            box-shadow: 0 0 10px #00000088;
            backdrop-filter: blur(30px);
        }
        #clock .label {
            font-size: 1.3vmin;
            opacity: 0.8;
        }

        #object-details {
            position: absolute;
            top: 140px;
            left: 120px;
            border-radius: 8px;
            border-width: 0.5px;
            border-style: solid;
            border-color: #ffffff1a;

            background: #56628a28;

            font-family: 'Inter';
            font-size: 1.8vmin;
            color: #ffffff;

            z-index: 5;
            display:none;
            box-shadow: 0 0 10px #00000088;
            backdrop-filter: blur(30px);
        }

        /* Style lil-gui root to match clock/object-details visual style (per docs) */
        .lil-gui {
            top: 140px;
            margin-top: 20px;
            right: 120px;
            border-radius: 8px;
            border: 0.5px solid #ffffff1a;
            background: #56628a28;
            font-family: 'Inter', sans-serif;
            font-size: 1.6vmin;
            color: #ffffff;
            z-index: 50;
            box-shadow: 0 0 10px #00000088;
            backdrop-filter: blur(30px);
            max-width: 36vmin;
            max-height: 60vh;
            overflow: auto;
            padding: 6px;
        }

        /* Inner root element */
        .lil-gui .lil-gui__root {
            background: transparent;
            color: inherit;
        }

        /* Title / folder header — this affects the main dropdown header */
        .lil-gui .lil-gui__title {
            background: transparent;
            color: inherit;
            border: none;
            padding: 6px 8px;
        }

        /* Icons, buttons and carets inside the title inherit color */
        .lil-gui .lil-gui__title button,
        .lil-gui .lil-gui__title svg,
        .lil-gui .lil-gui__title .lil-gui__button {
            background: transparent;
            color: inherit;
            fill: currentColor;
            border: none;
        }

        /* Controller rows and folder rows: transparent by default */
        .lil-gui .lil-gui__list .lil-gui__row,
        .lil-gui .lil-gui__folder .lil-gui__list .lil-gui__row {
            background: transparent;
            color: inherit;
        }

        /* Hover state for rows — subtle translucent highlight */
        .lil-gui .lil-gui__list .lil-gui__row:hover {
            background: rgba(255,255,255,0.03);
            color: inherit;
        }

        /* Names/values/controllers inherit foreground color */
        .lil-gui .lil-gui__name,
        .lil-gui .lil-gui__controller,
        .lil-gui .lil-gui__value {
            color: inherit;
        }

        /* Small vertical spacing for submenu rows and padding for nicer separation */
        .lil-gui .lil-gui__list {
            padding-top: 6px !important;
            padding-bottom: 6px !important;
        }

        .lil-gui .lil-gui__list .lil-gui__row,
        .lil-gui .lil-gui__folder .lil-gui__list .lil-gui__row {
            margin: 4px 0 !important;
            padding: 6px 8px !important;
            border-radius: 6px !important;
        }

        /* Style number sliders to resemble the app's progress bar */
        .lil-gui .controller.number .slider {
            background: rgba(255,255,255,0.08) !important;
            border-radius: 6px !important;
            height: 10px !important;
            padding-right: 8px !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
        }

        .lil-gui .controller.number .slider .fill {
            background: #485EA9 !important;
            border-radius: 6px !important;
            height: 100% !important;
            box-shadow: 0 2px 6px rgba(72,94,169,0.25) !important;
        }

        /* Style number input fields to match the slider / progress bar aesthetic */
        .lil-gui .controller.number input[type="number"],
        .lil-gui .controller.number input[type="text"] {
            background: rgba(255,255,255,0.04) !important;
            border: none !important;
            border-radius: 6px !important;
            padding: 4px 8px !important;
            min-width: 48px !important;
            color: inherit !important;
        }

        /* Ensure option displays (select-like) use the same subtle background */
        .lil-gui .controller.option .display,
        .lil-gui .controller.option .display.active {
            background: rgba(255,255,255,0.04) !important;
            border-radius: 6px !important;
            padding-left: 8px !important;
        }

        /* Stronger overrides to remove strokes/solid headers coming from lil-gui styles
           These use !important to override inline or library styles. */
        .lil-gui * {
            box-shadow: none !important;
            outline: none !important;
        }

        /* Remove separators/strokes on top/bottom of folders and lists */
        .lil-gui .lil-gui__title,
        .lil-gui .lil-gui__list,
        .lil-gui .lil-gui__folder {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* The topmost closed-folder header sometimes uses an internal background; force transparent */
        .lil-gui .lil-gui__title--closed,
        .lil-gui .lil-gui__title.lil-gui__title--closed {
            background: transparent !important;
            color: inherit !important;
        }

        /* Ensure hover for folder titles and rows use our subtle highlight */
        .lil-gui .lil-gui__title:hover,
        .lil-gui .lil-gui__folder .lil-gui__title:hover,
        .lil-gui .lil-gui__list .lil-gui__row:hover,
        .lil-gui .lil-gui__folder .lil-gui__list .lil-gui__row:hover {
            background: rgba(255,255,255,0.03) !important;
            color: inherit !important;
        }

        /* Inputs / sliders / buttons inside lil-gui should keep the theme, not inject background */
        .lil-gui .lil-gui__controller input,
        .lil-gui .lil-gui__controller button,
        .lil-gui .lil-gui__controller .lil-gui__value {
            background: transparent !important;
            color: inherit !important;
        }

        /* Override the CSS variables used by lil-gui to match our translucent theme.
           Using variable overrides is the cleanest way to change title/background colors. */
        .lil-gui {
            --background-color: rgba(86,98,138,0.16) !important;
            --title-background-color: transparent !important;
            --title-text-color: inherit !important;
            --widget-color: rgba(0,0,0,0.45) !important;
            --hover-color: rgba(255,255,255,0.03) !important;
            --focus-color: rgba(255,255,255,0.04) !important;
            --text-color: #ffffff !important;
            /* Width and name column adjustments so sliders have consistent length */
            --width: 360px !important;
            --name-width: 120px !important;
        }

        /* Boolean checkbox styling to match the app theme (rounded, subtle background, colored when checked) */
        .lil-gui input[type="checkbox"] {
            appearance: none !important;
            -webkit-appearance: none !important;
            width: 16px !important;
            height: 16px !important;
            border-radius: 4px !important;
            display: inline-block !important;
            vertical-align: middle !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            background: rgba(255,255,255,0.02) !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.02) !important;
            text-align: center !important;
            line-height: 16px !important;
            color: transparent !important;
        }

        .lil-gui input[type="checkbox"]:checked {
            background: #485EA9 !important;
            border-color: #485EA9 !important;
            color: #fff !important;
        }

        .lil-gui input[type="checkbox"]:checked:before {
            content: "\2713" !important;
            display: block !important;
            color: #fff !important;
            font-size: 12px !important;
        }

        /* Remove the top/bottom border strokes the library applies to nested folder headers */
        .lil-gui.root>.children>.lil-gui>.title,
        .lil-gui.root>.children>.lil-gui.closed>.title,
        .lil-gui .lil-gui .lil-gui>.title {
            border: none !important;
            background: transparent !important;
        }

        /* Prevent the adjacent-controller top border inserted after a lil-gui */
        .lil-gui + .controller {
            border-top: none !important;
            margin-top: 0 !important;
            padding-top: 0 !important;
        }

        /* Ensure the root title (topmost 'Controls') is transparent and inherits color */
        .lil-gui.root > .title {
            background: transparent !important;
            color: inherit !important;
        }

        button {
            font-size: 1.5vmin;
            padding: 5px 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background-color: #485EA9;
            color: white;
            cursor: pointer;
            transition: background-color 0.15s ease;
            float: right;
        }

        button:hover {
            background-color: #9dabd8;
        }

        .contents-container {
            max-width: 40vmin;
            max-height: 30vh;
            overflow: auto;
            padding: 10px;
        }

        #container-title {
            margin: 0;
            font-size: 2vmin;
        }

        #container-description {
            font-size: 1.5vmin;
        }

    </style>
</head>

<body>
    <div id="title">

    <div id="object-details" class="border-gradient border-gradient-purple">

    </div>
    <!-- Loading overlay -->
    <div id="loading-overlay" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;backdrop-filter: blur(8px);-webkit-backdrop-filter: blur(8px);pointer-events:auto;background:rgba(0,0,0,0.35);transition:opacity 0.6s ease;">
        <div id="loading-box" style="text-align:center;padding:30px 40px;border-radius:12px;background:rgba(86,98,138,0.18);box-shadow:0 8px 30px rgba(0,0,0,0.6);border:1px solid #ffffff1a;color:#fff;font-family: 'Inter', monospace;">
            <div id="loading-title" style="font-size:2.4vmin;margin-bottom:10px;letter-spacing:2px">LOADING</div>
            <div id="loading-msg" style="font-size:1.6vmin;opacity:0.9;max-width:40vmin;word-wrap:break-word">Initializing...</div>
            <div id="loading-progress" style="margin-top:14px;width:36vmin;max-width:60vw;background:rgba(255,255,255,0.08);height:10px;border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);">
                <div id="loading-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="height:100%;width:0%;background:#485EA9;transition:width 300ms ease;border-radius:0 6px 6px 0;"></div>
            </div>
            <div id="loading-percent" style="margin-top:8px;font-size:1.2vmin;opacity:0.85">0%</div>
        </div>
    </div>
    <script type="importmap">

    </script>
    <script type="module">
        import Port3D from "/visualizer/port3d_init.ts";

        // Expose simple loading overlay API for the visualizer modules
        window.showLoading = (msg = 'Starting...') => {
            const ov = document.getElementById('loading-overlay');
            const msgEl = document.getElementById('loading-msg');
            const titleEl = document.getElementById('loading-title');
            if (msgEl) msgEl.textContent = msg;
            if (titleEl) titleEl.textContent = 'LOADING';
            if (ov) {
                ov.style.display = 'flex';
                // force reflow then set opacity
                ov.style.opacity = '1';
                // reset progress bar
                const bar = document.getElementById('loading-progress-bar');
                const pct = document.getElementById('loading-percent');
                if (bar) { bar.style.width = '0%'; bar.setAttribute('aria-valuenow','0'); }
                if (pct) pct.textContent = '0%';
            }
        };

        window.updateLoading = (msg = '') => {
            const msgEl = document.getElementById('loading-msg');
            if (msgEl) msgEl.textContent = msg;
        };

        window.setLoadingProgress = (value = 0) => {
            const clamped = Math.max(0, Math.min(100, Math.round(value)));
            const bar = document.getElementById('loading-progress-bar');
            const pct = document.getElementById('loading-percent');
            if (bar) {
                bar.style.width = clamped + '%';
                // Rounded tip: right-rounded when not full, fully rounded when 100%
                if (clamped >= 100) {
                    bar.style.borderRadius = '6px';
                } else {
                    bar.style.borderRadius = '0 6px 6px 0';
                }
                try { bar.setAttribute('aria-valuenow', String(clamped)); } catch (e) {}
            }
            if (pct) pct.textContent = clamped + '%';
        };

        window.hideLoading = (delay = 200) => {
            const ov = document.getElementById('loading-overlay');
            if (!ov) return;
            ov.style.opacity = '0';
            setTimeout(() => { ov.style.display = 'none'; }, Math.max(300, delay));
        };

            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.toggleVesselLegend = () => {
            const legend = document.getElementById('vessel-status-legend');
            if (legend) {
                legend.classList.toggle('collapsed');
            }
        };

            // controls.maxDistance = 9.0;

            // // Create a box geometry
            // const geometry = new THREE.BoxGeometry();

            // // Create a texture  
            // const texture = new THREE.TextureLoader().load("/favicon.ico");
            // texture.colorSpace = THREE.SRGBColorSpace;

            // // Create a white-colored material with the specified texture
            // const material = new THREE.MeshBasicMaterial({ color: 0xffffff, map: texture });

            // // Create a mesh with the specified geometry and material
            // cube = new THREE.Mesh(geometry, material);

            // scene.add(cube);
