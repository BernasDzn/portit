    <style>
        body {
            margin: 0;
        }

        #title {
            position: absolute;
            top: 20px;
            width: 100vw;
            z-index: 1;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 2.5vmin;
            color: white;
        }

        #help {
            position: absolute;
            bottom: 2vh;
            right: 1vw;
            z-index: 1;
            font-family: Arial, sans-serif;
            font-size: 1.3vmin;
            color: white;
        }

        table {
            table-layout: fixed;
            margin: auto;
            border: 1px solid gray;
        }

        table {
            width: 24vmin;
            background-color: #A0A0A050;
        }

        th,
        td {
            overflow: hidden;
            border: 1px solid gray;
        }

        canvas {
            display: block;
        }

        #clock {
            position: absolute;
            top: 30px;
            left: 120px;
            padding: 10px 16px;
            border-radius: 8px;
            border-width: 0.5px;
            border-style: solid;
            border-color: #ffffff1a;

            background: #56628a28;

            font-family: 'Inter';
            font-size: 1.8vmin;
            color: #ffffff;

            z-index: 5;
            box-shadow: 0 0 10px #00000088;
            backdrop-filter: blur(30px);
        }
        #clock .label {
            font-size: 1.3vmin;
            opacity: 0.8;
        }

        #object-details {
            position: absolute;
            top: 140px;
            left: 120px;
            border-radius: 8px;
            border-width: 0.5px;
            border-style: solid;
            border-color: #ffffff1a;

            background: #56628a28;

            font-family: 'Inter';
            font-size: 1.8vmin;
            color: #ffffff;

            z-index: 5;
            display:none;
            box-shadow: 0 0 10px #00000088;
            backdrop-filter: blur(30px);
        }

        button {
            font-size: 1.5vmin;
            padding: 5px 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background-color: #485EA9;
            color: white;
            cursor: pointer;
            transition: background-color 0.15s ease;
            float: right;
        }

        button:hover {
            background-color: #9dabd8;
        }

        .contents-container {
            max-width: 40vmin;
            max-height: 30vh;
            overflow: auto;
            padding: 10px;
        }

        #container-title {
            margin: 0;
            font-size: 2vmin;
        }

        #container-description {
            font-size: 1.5vmin;
        }

    </style>
</head>

            <button id="kill">Remove</button>

    <div id="clock" class="border-gradient border-gradient-purple">
