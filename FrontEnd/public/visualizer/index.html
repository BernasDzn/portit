    <script type="module">

        // Expose simple loading overlay API for the visualizer modules
        window.showLoading = (msg = 'Starting...') => {
            const ov = document.getElementById('loading-overlay');
            const msgEl = document.getElementById('loading-msg');
            const titleEl = document.getElementById('loading-title');
            if (msgEl) msgEl.textContent = msg;
            if (titleEl) titleEl.textContent = 'LOADING';
            if (ov) {
                ov.style.display = 'flex';
                // force reflow then set opacity
                ov.style.opacity = '1';
                // reset progress bar
                const bar = document.getElementById('loading-progress-bar');
                const pct = document.getElementById('loading-percent');
                if (bar) { bar.style.width = '0%'; bar.setAttribute('aria-valuenow','0'); }
                if (pct) pct.textContent = '0%';
            }
        };

        window.updateLoading = (msg = '') => {
            const msgEl = document.getElementById('loading-msg');
            if (msgEl) msgEl.textContent = msg;
        };

        window.setLoadingProgress = (value = 0) => {
            const clamped = Math.max(0, Math.min(100, Math.round(value)));
            const bar = document.getElementById('loading-progress-bar');
            const pct = document.getElementById('loading-percent');
            if (bar) {
                bar.style.width = clamped + '%';
                // Rounded tip: right-rounded when not full, fully rounded when 100%
                if (clamped >= 100) {
                    bar.style.borderRadius = '6px';
                } else {
                    bar.style.borderRadius = '0 6px 6px 0';
                }
                try { bar.setAttribute('aria-valuenow', String(clamped)); } catch (e) {}
            }
            if (pct) pct.textContent = clamped + '%';
        };

        window.hideLoading = (delay = 200) => {
            const ov = document.getElementById('loading-overlay');
            if (!ov) return;
            ov.style.opacity = '0';
            setTimeout(() => { ov.style.display = 'none'; }, Math.max(300, delay));
        };
