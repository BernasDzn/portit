name: Build and Release .NET Backend

on:
  push:
    tags:
      - 'v*'  # Only run on version tags like vX.Y.Z

jobs:
  release:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        configuration: [Release]

    env:
      Solution_Name: BackEnd/BackEnd.sln
      Project_Path: BackEnd/Api/Api.csproj
      Test_Project_Path: BackEnd/Tests/Tests.csproj
      Output_Folder: publish

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Cache NuGet packages
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Restore solution
    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Name }}

    # Build solution
    - name: Build solution
      run: dotnet build ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --no-restore

    # Run unit tests
    - name: Run tests
      run: dotnet test ${{ env.Test_Project_Path }} --configuration ${{ matrix.configuration }} --no-build --verbosity normal

    # Publish project to a folder
    - name: Publish project
      run: dotnet publish ${{ env.Project_Path }} --configuration ${{ matrix.configuration }} --output ${{ env.Output_Folder }}

    # Zip the published binaries
    - name: Zip published binaries
      run: |
        cd ${{ env.Output_Folder }}
        zip -r ../api-release.zip ./*
        cd ..

    # Create GitHub Release
    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Upload the zip file as the release asset
    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./api-release.zip
        asset_name: api-release.zip
        asset_content_type: application/zip
