name: Build and Release .NET Backend (Linux + Windows)

on:
  push:
    tags:
      - 'v*'  # Only run on version tags like v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Release]

    env:
      Solution_Name: BackEnd/BackEnd.sln
      Project_Path: BackEnd/Api/Api.csproj
      Test_Project_Path: BackEnd/Tests/Tests.csproj
      Output_Folder: publish

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    # Cache NuGet packages
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Restore dependencies
    - name: Restore solution
      run: dotnet restore ${{ env.Solution_Name }}

    # Build solution
    - name: Build solution
      run: dotnet build ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --no-restore

    # Run tests
    - name: Run tests
      run: dotnet test ${{ env.Test_Project_Path }} --configuration ${{ matrix.configuration }} --no-build --verbosity normal

    # Setup Node.js for frontend build
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: FrontEnd/package-lock.json

    # Install frontend dependencies
    - name: Install frontend dependencies
      run: npm ci
      working-directory: FrontEnd

    # Build frontend
    - name: Build frontend
      run: npm run build
      working-directory: FrontEnd

    # Publish Linux self-contained executable
    - name: Publish Linux binaries
      run: |
        dotnet publish ${{ env.Project_Path }} \
          -c ${{ matrix.configuration }} \
          -r linux-x64 \
          --self-contained true \
          /p:PublishSingleFile=true \
          -o ${{ env.Output_Folder }}/linux

    # Publish Windows self-contained executable
    - name: Publish Windows binaries
      run: |
        dotnet publish ${{ env.Project_Path }} \
          -c ${{ matrix.configuration }} \
          -r win-x64 \
          --self-contained true \
          /p:PublishSingleFile=true \
          -o ${{ env.Output_Folder }}/windows

    # Zip Linux binaries
    - name: Zip Linux binaries
      run: |
        cd ${{ env.Output_Folder }}/linux
        zip -r ../../linux-release.zip ./*
        cd ../../

    # Zip Windows binaries
    - name: Zip Windows binaries
      run: |
        cd ${{ env.Output_Folder }}/windows
        zip -r ../../windows-release.zip ./*
        cd ../../

    # Zip frontend dist folder
    - name: Zip frontend build
      run: |
        cd FrontEnd/dist
        zip -r ../../frontend-dist.zip ./*
        cd ../../

    # Create GitHub Release
    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Upload Linux zip
    - name: Upload Linux release asset
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./linux-release.zip
        asset_name: linux-release.zip
        asset_content_type: application/zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Upload Windows release asset
    - name: Upload Windows release asset
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./windows-release.zip
        asset_name: windows-release.zip
        asset_content_type: application/zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Upload frontend build
    - name: Upload frontend build asset
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./frontend-dist.zip
        asset_name: frontend-dist.zip
        asset_content_type: application/zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}