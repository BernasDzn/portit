name: Build and Release .NET Backend

on:
  push:
    tags:
      - 'v*'  # Triggers only on tags like v1.0.0, v2.1.3

jobs:
  release:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        configuration: [Release]

    env:
      Solution_Name: BackEnd/BackEnd.sln
      Test_Project_Path: BackEnd/Tests/Tests.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Cache NuGet packages
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Name }}

    - name: Build
      run: dotnet build ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --no-restore

    - name: Run unit tests
      run: dotnet test ${{ env.Test_Project_Path }} --configuration ${{ matrix.configuration }} --no-build --verbosity normal

    - name: Publish binaries
      run: dotnet publish ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --output ./publish

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: publish/**
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
